name: Gerar instaladores

# Estrutura esperada: os arquivos do projeto (omega.py, requirements.txt, assets/, installer/...) ficam na RAIZ do repositório.
# Roda ao enviar uma tag que comece com "v" (ex.: v1.2.1) ou manualmente em Actions > Run workflow.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Compilar Windows
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Descobrir a versão do código
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path omega_core.py -Pattern 'VERSION = "(.*)"').Matches.Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versão do código: $v"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") { throw "A tag é ${{ github.ref_name }}, mas o código diz v$v" }

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar aplicativo
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --name Omega --icon "assets/icon.ico" --add-data "assets;assets" omega.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "installer_out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup não encontrado: $iscc" }
          if (!(Test-Path "dist\Omega\Omega.exe")) { throw "A compilação não gerou dist\Omega\Omega.exe" }
          if (!(Test-Path "installer\omega.iss")) { throw "Arquivo installer\omega.iss não encontrado" }
          & $iscc "/O$out" "/FOmega-Setup" "/DAppVer=${{ steps.ver.outputs.version }}" "installer\omega.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$out\Omega-Setup.exe")) { throw "O instalador Omega-Setup.exe não foi gerado" }

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Windows
          path: installer_out/Omega-Setup.exe
          if-no-files-found: error

  macos:
    name: Compilar macOS
    runs-on: macos-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar aplicativo
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name Omega \
            --icon assets/icon.icns \
            --add-data "assets:assets" \
            omega.py

      - name: Gerar arquivo DMG
        run: |
          test -d "dist/Omega.app"
          hdiutil create -volname "Omega" -srcfolder "dist/Omega.app" -ov -format UDZO "Omega.dmg"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Omega-macOS
          path: Omega.dmg
          if-no-files-found: error

  linux:
    name: Compilar Linux
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar aplicativo
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name Omega \
            --add-data "assets:assets" \
            omega.py

      - name: Gerar arquivo TAR.GZ
        run: |
          test -d "dist/Omega"
          tar -czf Omega-linux.tar.gz -C dist Omega

      - name: Guardar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Linux
          path: Omega-linux.tar.gz
          if-no-files-found: error

  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    # roda mesmo que macOS/Linux falhem, desde que o Windows tenha dado certo; só em execuções disparadas por tag
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' }}
    steps:
      - name: Baixar os arquivos gerados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
