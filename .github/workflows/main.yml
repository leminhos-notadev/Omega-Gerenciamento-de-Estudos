
name: Gerar instaladores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Compilar Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r omega/requirements.txt pyinstaller

      - name: Compilar aplicativo
        working-directory: omega
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --name Omega --icon "assets/icon.ico" --add-data "assets;assets" omega.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          $installerOut = Join-Path $env:GITHUB_WORKSPACE "installer_out"
          New-Item -ItemType Directory -Force -Path $installerOut | Out-Null

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $iss  = Join-Path $env:GITHUB_WORKSPACE "omega\installer\omega.iss"

          if (!(Test-Path $iscc)) { throw "Inno Setup não encontrado: $iscc" }
          if (!(Test-Path $iss))  { throw "Arquivo não encontrado: $iss" }
          if (!(Test-Path "omega\dist\Omega\Omega.exe")) { throw "A compilação não gerou omega\dist\Omega\Omega.exe" }

          & $iscc "/O$installerOut" "/FOmega-Setup" $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (!(Test-Path "$installerOut\Omega-Setup.exe")) { throw "O instalador Omega-Setup.exe não foi gerado." }

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Windows
          path: installer_out/Omega-Setup.exe
          if-no-files-found: error
          
  macos:
    name: Compilar macOS
    runs-on: macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r omega/requirements.txt pyinstaller


      - name: Compilar aplicativo
        run: |
          pyinstaller --noconfirm --clean --windowed \
          --name Omega \
          --add-data "omega/assets:assets" \
          omega/omega.py


      - name: Gerar arquivo DMG
        run: |
          test -d "dist/Omega.app"
          hdiutil create \
            -volname "Omega" \
            -srcfolder "dist/Omega.app" \
            -ov \
            -format UDZO \
            "Omega.dmg"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Omega-macOS
          path: Omega.dmg
          if-no-files-found: error

  linux:
    name: Compilar Linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r omega/requirements.txt pyinstaller

      - name: Compilar aplicativo
        run: |
          pyinstaller --noconfirm --clean --windowed \
          --name Omega \
          --add-data "omega/assets:assets" \
          omega/omega.py


      - name: Gerar arquivo TAR.GZ
        run: |
          test -d "dist/Omega"
          tar -czf Omega-linux.tar.gz -C dist Omega

      - name: Guardar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Linux
          path: Omega-linux.tar.gz
          if-no-files-found: error

  release:
    name: Publicar Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
      - linux

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Baixar todos os arquivos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publicar instaladores na Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Omega-Setup.exe
            release-assets/Omega.dmg
            release-assets/Omega-linux.tar.gz
